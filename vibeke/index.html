<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Til Vibeke</title>
  <meta name="theme-color" content="#031225" />
  <style>
    :root {
      --bg: #031225;
      --bg2: #061a33;
      --text: rgba(255,255,255,0.96);
      --muted: rgba(255,255,255,0.86);
      --accent: #d6ad67;
      --line: rgba(255,255,255,0.08);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(19, 72, 124, 0.26), transparent 34%),
        linear-gradient(180deg, #041122 0%, #031225 52%, #04152a 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding:
        calc(env(safe-area-inset-top) + 10px)
        12px
        calc(env(safe-area-inset-bottom) + 10px);
    }

    .page {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) 21svh;
      gap: 12px;
    }

    .hero {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border-radius: 24px;
      background: #0d223f;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2,12,24,0.78) 0%, rgba(2,12,24,0.46) 42%, rgba(2,12,24,0.10) 100%),
        linear-gradient(180deg, rgba(2,12,24,0.05) 0%, rgba(2,12,24,0.10) 54%, rgba(2,12,24,0.58) 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 14px 16px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      max-width: 9ch;
      font-size: clamp(2.25rem, 8.6vw, 3.6rem);
      line-height: 0.97;
      letter-spacing: -0.055em;
      font-weight: 650;
    }

    .accent {
      color: var(--accent);
    }

    .subcopy {
      margin-top: 12px;
      max-width: 18ch;
      font-size: clamp(0.94rem, 3.3vw, 1.08rem);
      line-height: 1.33;
      color: var(--muted);
      font-weight: 400;
    }

    .mini-card {
      align-self: start;
      max-width: min(100%, 420px);
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(10, 27, 51, 0.68);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 34px rgba(0,0,0,0.16);
    }

    .mini-card p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.38;
      color: rgba(255,255,255,0.93);
    }

    .feature {
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 20px 50px rgba(0,0,0,0.22);
      min-height: 0;
    }

    .feature img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Vibeke surprise page hero">
      <img src="assets/terrasse.png" alt="Terrasse ved sjøen på Karmøy" />
      <div class="hero-inner">
        <div>
          <div class="eyebrow">Til Vibeke</div>
          <h1>
            Fra denne<br>
            terrassen kan vi<br>
            <span class="accent">bokstavelig talt</span><br>
            <span class="accent">hoppe utti sjøen!</span>
          </h1>

          <p class="subcopy">
            Dette blir final destination av turen,<br>
            resten av reisen booker vi sammen ;)
          </p>
        </div>

        <div class="mini-card">
          <p>To netter på Karmøy er booket. Resten setter vi opp sammen.</p>
        </div>
      </div>
    </section>

    <section class="feature" aria-label="Karmøy view">
      <img src="assets/karmoy_aerial.png" alt="Luftbilde av Karmøy" />
    </section>
  </main>
</body>
</html>
