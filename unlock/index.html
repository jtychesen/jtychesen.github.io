<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lås opp gave</title>

<style>
:root{
    --bg:#031225;
    --card:#081b35;
    --accent:#d6ad67;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top right, rgba(25,80,140,.3), transparent 30%),
        #031225;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:100%;
    max-width:420px;
    background:rgba(8,27,53,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:32px 24px;
}

.small{
    color:var(--accent);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:.8rem;
    margin-bottom:12px;
}

h1{
    font-size:2rem;
    margin-bottom:14px;
}

p{
    color:rgba(255,255,255,.8);
    line-height:1.5;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:none;
    outline:none;
    font-size:1rem;
    margin-bottom:14px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#111;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
}

.message{
    margin-top:16px;
    color:var(--accent);
    min-height:24px;
}
</style>
</head>
<body>

<div class="card">

<div class="small">Bursdagsgave</div>

<h1>Lås opp gaven 🎁</h1>

<p>
Hva heter han mannen som er prest og sykler rundt hele tiden?
</p>

<input
id="answer"
type="text"
placeholder="Skriv svaret her..."
autocomplete="off">

<button onclick="checkAnswer()">
Lås opp
</button>

<div class="message" id="message"></div>

</div>

<script>
function checkAnswer() {

    const answer =
        document
        .getElementById('answer')
        .value
        .trim()
        .toLowerCase();

    const validAnswers = [
        'fader brown',
        'faderbrown',
        'brown'
    ];

    const message =
        document.getElementById('message');

    if(validAnswers.includes(answer)){

        message.textContent = 'Riktig 😊';

        setTimeout(() => {
            window.location.href = '/vibeke/';
        }, 1000);

    } else {

        message.textContent =
            'Nesten. Prøv igjen 😉';
    }
}

document
.getElementById('answer')
.addEventListener('keydown', function(e){

    if(e.key === 'Enter'){
        checkAnswer();
    }
});
</script>

</body>
</html>
